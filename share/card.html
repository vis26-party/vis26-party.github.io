<!doctype html>
<!-- Source for og-image.png. Re-render with the command in README.md. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600&family=Zilla+Slab:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --band: #f7f1ec;
      --text: #313639;
      --brown: #693a19;
      --orange: #df6824;
      --raspberry: #bb4a72;
      --line: #ecdcd0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 12% 20%, rgba(249, 180, 121, 0.28) 0 3px, transparent 4px) 0 0 / 28px 28px,
        var(--band);
      color: var(--text);
      font-family: "Fira Sans", sans-serif;
    }
    .bar {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brown);
      color: #fff;
      font: 700 22px "Zilla Slab", serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-bottom: 10px solid var(--raspberry);
    }
    h1 {
      margin: 0;
      font: 700 86px/1 "Zilla Slab", serif;
      color: var(--raspberry);
    }
    h1 span { display: block; color: var(--orange); }
    .when {
      margin: 22px 0 30px;
      font: 600 32px "Fira Sans", sans-serif;
      color: var(--brown);
    }
    .logos {
      display: flex;
      gap: 12px;
    }
    .logos div {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 172px;
      height: 74px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .logos img { height: var(--h); max-width: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div class="bar">VIS 26 &middot; Boston</div>
  <main>
    <h1>West Coast / Utah Party <span>at VIS 26</span></h1>
    <p class="when">Tue Nov 10 &middot; 8pm&ndash;midnight &middot; Howl at the Moon</p>
    <div class="logos">
      <div style="--h:30px"><img src="../logos/tableau.png" alt=""></div>
      <div style="--h:30px"><img src="../logos/ubc.png" alt=""></div>
      <div style="--h:30px"><img src="../logos/uw.png" alt=""></div>
      <div style="--h:25px"><img src="../logos/ridge-ai.png" alt=""></div>
      <div style="--h:38px"><img src="../logos/berkeley.png" alt=""></div>
      <div style="--h:56px"><img src="../logos/sci.png" alt=""></div>
    </div>
  </main>
</body>
</html>
